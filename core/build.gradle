base {
    archivesName = 'adept_core'
}

neoForge {
    runs {
        // Отдельные запуски одного «Ядра», без «Сюжета».
        client {
            client()
            gameDirectory = project.file('run/client')
        }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = project.file('run/gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'adept_core'
        }
    }

    mods {
        adept_core {
            sourceSet sourceSets.main
        }
    }
}

// Датапак сборки (pack/datapack): правки сторонних модов, которые делаются только данными.
// Едет в jar ядра; файлы с условием neoforge:mod_loaded без нужного мода пропускаются.
sourceSets.main.resources.srcDir rootProject.file('pack/datapack')
