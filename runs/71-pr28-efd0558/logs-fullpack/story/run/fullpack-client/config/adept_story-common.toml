#Ветка сюжета для новых миров.
#PUBLIC — обычная ветка для всех игроков.
#STREAMER — ветка для стримов автора сборки. Если вы не автор, не меняйте.
#Ветка записывается в мир при его создании. Уже начатые миры продолжают свою ветку.
#Allowed Values: PUBLIC, STREAMER
branch = "PUBLIC"

#Реплики героев и жителей субтитрами
[talk]
	#Реплику героя слышат игроки в этом радиусе, блоков
	# Default: 32
	# Range: 4 ~ 128
	heroRadius = 32
	#Шанс, что ученик скажет реплику на событие боя
	# Default: 0.7
	# Range: 0.0 ~ 1.0
	apprenticeChance = 0.7
	#Шанс, что ветеран скажет реплику на событие боя (ветераны молчаливее)
	# Default: 0.35
	# Range: 0.0 ~ 1.0
	veteranChance = 0.35
	#Откат реплик одного героя, секунд
	# Default: 12
	# Range: 0 ~ 600
	heroCooldownSeconds = 12
	#Откат одного и того же события внутри отряда, секунд (на «союзник пал» отвечает один боец)
	# Default: 10
	# Range: 0 ~ 600
	squadEventCooldownSeconds = 10
	#Пауза между любыми репликами героев, секунд (чтобы не говорили хором)
	# Default: 3
	# Range: 0 ~ 60
	heroGlobalCooldownSeconds = 3
	#Пауза между репликами жителей и старейшин, секунд
	# Default: 5
	# Range: 0 ~ 600
	villagerCooldownSeconds = 5
	#С этой угрозы жители говорят как с опасным чужаком (в тон порогу ядра, с которого жители не торгуют)
	# Default: 50
	# Range: 0 ~ 100
	highThreat = 50
